<div class="logo" [style.gap]="gap()">
  <svg
    class="icon"
    [style.width]="iconSize()"
    [style.height]="iconSize()"
    viewBox="0 0 32 32"
    fill="none"
    xmlns="http://www.w3.org/2000/svg"
    aria-hidden="true"
  >
    <circle cx="16" cy="8" r="2.5" fill="var(--sensorix-teal)" />
    <circle cx="8" cy="20" r="2.5" fill="var(--sensorix-teal)" />
    <circle cx="24" cy="20" r="2.5" fill="var(--sensorix-teal)" />
    <circle cx="16" cy="26" r="2" fill="var(--sensorix-teal)" />
    <line
      x1="16"
      y1="10.5"
      x2="10"
      y2="18"
      stroke="var(--sensorix-teal)"
      stroke-width="1.5"
      stroke-linecap="round"
    />
    <line
      x1="16"
      y1="10.5"
      x2="22"
      y2="18"
      stroke="var(--sensorix-teal)"
      stroke-width="1.5"
      stroke-linecap="round"
    />
    <line
      x1="10"
      y1="22"
      x2="16"
      y2="24.5"
      stroke="var(--sensorix-teal)"
      stroke-width="1.5"
      stroke-linecap="round"
    />
    <line
      x1="22"
      y1="22"
      x2="16"
      y2="24.5"
      stroke="var(--sensorix-teal)"
      stroke-width="1.5"
      stroke-linecap="round"
    />
  </svg>

  @if (showText()) {
    <span class="text" [style.font-size]="textSize()" [style.font-weight]="textWeight()">
      {{ text() }}
    </span>
  }
</div>
