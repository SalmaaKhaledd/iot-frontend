<div class="confirm-dialog-container">
  <h2 mat-dialog-title class="dialog-title">{{ data.title }}</h2>
  <mat-dialog-content class="dialog-content">
    <p>{{ data.message }}</p>
  </mat-dialog-content>
  <mat-dialog-actions class="dialog-actions">
    <button class="btn-cancel" (click)="onCancel()">{{ data.cancelText }}</button>
    <button class="btn-confirm" (click)="onConfirm()">{{ data.confirmText }}</button>
  </mat-dialog-actions>
</div>
