<div class="custom-select" [class.open]="isOpen()">
  <button
    type="button"
    class="select-trigger"
    (click)="toggle()"
    data-testid="custom-select-trigger">
    <span class="select-value" [class.placeholder]="!selectedLabel()">
      {{ selectedLabel() || placeholder }}
    </span>
    <mat-icon class="select-chevron" [class.rotated]="isOpen()">expand_more</mat-icon>
  </button>

  @if (isOpen()) {
    <div class="select-dropdown" data-testid="custom-select-dropdown">
      @for (option of options; track option.value) {
        <button
          type="button"
          class="select-option"
          [class.selected]="option.value === value"
          (click)="select(option)"
          [attr.data-testid]="'option-' + option.value">
          {{ option.label }}
          @if (option.value === value) {
            <mat-icon class="check-icon">check</mat-icon>
          }
        </button>
      }
    </div>
  }
</div>
