<div class="home-page">
  <app-topbar (jumpToAlert)="handleJumpToAlert($any($event))"></app-topbar>


  <main class="hero">
    <div class="max-w">
      <div class="hero-intro mb-6">
        <h1 class="greeting">Good morning, {{ displayName() }}</h1>
        <p class="muted">Here's what's happening in your area today</p>
      </div>
      <div class="dashboard-cards">
        <div class="card" (click)="goToDashboard('traffic')" data-testid="traffic-nav-card">
          <div class="card-header">
            <div class="icon-wrap blue">
              <mat-icon>traffic</mat-icon>
            </div>
            <h3>Traffic</h3>
          </div>
          <p class="muted small">Monitor road congestion and traffic flow</p>
        </div>

        <div class="card" (click)="scrollToSensor('air-quality-sensor')" data-testid="air-quality-nav-card">
          <div class="card-header">
            <div class="icon-wrap green">
              <mat-icon>air</mat-icon>
            </div>
            <h3>Air Quality</h3>
          </div>
          <p class="muted small">Track pollution levels and air health</p>
        </div>

        <div class="card" (click)="scrollToSensor('street-light-sensor')" data-testid="street-light-nav-card">
          <div class="card-header">
            <div class="icon-wrap yellow">
              <mat-icon>lightbulb</mat-icon>
            </div>
            <h3>Street Lights</h3>
          </div>
          <p class="muted small">Manage lighting and energy usage</p>
        </div>
      </div>

      <div class="sensor-cards">
        <div id="traffic-sensor">
          <app-traffic-sensor-card></app-traffic-sensor-card>
        </div>
        <div id="air-quality-sensor">
          <app-air-quality-sensor-card></app-air-quality-sensor-card>
        </div>
        <div id="street-light-sensor">
          <app-street-light-card></app-street-light-card>
        </div>
      </div>
    </div>
  </main>
</div>
