<div class="home-page">
  <header class="topbar">
    <div class="brand">
      <app-sensorix-logo
        [iconSize]="'clamp(22px, 2.8vw, 30px)'"
        [textSize]="'clamp(18px, 2.2vw, 24px)'"
        [gap]="'12px'"
        [textWeight]="'600'"
      />
    </div>

    <div class="topbar-actions">
      <button class="icon-button" type="button" aria-label="Toggle theme">
        ☼
      </button>
      <div class="avatar">{{ userInitials }}</div>
    </div>
  </header>

  <main class="hero">
    <h1>Good morning, {{ displayName }}</h1>
    <p>Your dashboard is being set up</p>
  </main>
</div>
