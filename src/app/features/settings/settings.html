<div class="settings-page">
  <app-topbar (jumpToAlert)="onJumpToAlert($event)"></app-topbar>

  <main class="content">
    @if (showSuccessMessage()) {
      <div class="toast-success" role="alert">
        <mat-icon aria-hidden="true">check_circle</mat-icon>
        <span>Settings saved successfully!</span>
      </div>
    }

    <div class="page-frame">
      <div class="page-toolbar">
        <button type="button" class="back-button" (click)="goHome()">
          <mat-icon aria-hidden="true">arrow_back</mat-icon>
          <span>Back to Home</span>
        </button>
      </div>

      <header class="page-header">
        <div class="header-title-row">
          <div>
            <h1>Settings</h1>
            <p>Configure your sensor thresholds and reading intervals</p>
          </div>

          @if (isDirty()) {
            <span class="unsaved-badge">Unsaved changes</span>
          }
        </div>
      </header>

      <section class="settings-shell">
        <aside class="tab-rail" role="tablist" aria-label="Settings sections">
          @for (tab of tabs; track tab.id) {
            <button
              type="button"
              class="tab-button"
              [class.active]="activeTab() === tab.id"
              role="tab"
              [attr.aria-selected]="activeTab() === tab.id"
              (click)="setActiveTab(tab.id)">
              <mat-icon aria-hidden="true">{{ tab.icon }}</mat-icon>
              <span class="tab-copy">
                <strong>{{ tab.title }}</strong>
                <small>{{ tab.description }}</small>
              </span>
            </button>
          }
        </aside>

        <section class="tab-panel" aria-live="polite">
          @switch (activeTab()) {
            @case ('thresholds') {
              <app-settings-thresholds-panel
                [categories]="categories()"
                (changed)="checkForChanges()" />
            }

            @case ('configuration') {
              <app-settings-configuration-panel
                [sensorConfig]="sensorConfig()"
                (changed)="checkForChanges()" />
            }
          }

          <div class="form-actions">
            <button type="button" class="save-btn" [disabled]="!isDirty()" (click)="saveChanges()">
              <mat-icon aria-hidden="true">save</mat-icon>
              Save Changes
            </button>
          </div>
        </section>
      </section>
    </div>
  </main>
</div>
