apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: frontend-pipeline

spec:
  params:
    - name: repo-url
      type: string

    - name: revision
      type: string

    - name: deploy
      type: string
      default: "false"

    # Shared, non-secret SonarQube Cloud configuration.
    - name: sonar-organization
      type: string
      default: "dxcelerators"

    - name: sonar-project-key
      type: string
      default: "dxcelerators_iot-frontend"

    # Leave empty for sonarcloud.io (EU). Use "us" for sonarqube.us.
    - name: sonar-region
      type: string
      default: ""

  workspaces:
    - name: source

    - name: basic-auth

    - name: dockerconfig
      optional: true

  tasks:
    # Clone the exact commit that triggered the PipelineRun.
    - name: fetch-repository
      taskRef:
        name: git-clone

      params:
        - name: url
          value: $(params.repo-url)

        - name: revision
          value: $(params.revision)

        # A large positive depth avoids a one-commit shallow clone while
        # remaining compatible with the catalog git-clone Task.
        - name: depth
          value: "1000"

      workspaces:
        - name: output
          workspace: source

        - name: basic-auth
          workspace: basic-auth

    # Install locked dependencies, run Angular tests, and create LCOV coverage.
    - name: test-frontend
      runAfter:
        - fetch-repository

      taskSpec:
        workspaces:
          - name: source

        steps:
          - name: npm-test
            image: docker.io/library/node:22-alpine
            workingDir: $(workspaces.source.path)

            env:
              - name: HOME
                value: $(workspaces.source.path)

              - name: NPM_CONFIG_CACHE
                value: $(workspaces.source.path)/.npm

              - name: CI
                value: "true"

            script: |
              #!/bin/sh
              set -eu

              npm ci
              npm test -- \
                --watch=false \
                --progress=false \
                --coverage \
                --coverage-reporters=lcov
              rm -rf "$NPM_CONFIG_CACHE"

      workspaces:
        - name: source
          workspace: source

    # Free-plan setup: analyze and gate main-branch deployments.
    # The task is skipped in the test-only PR PipelineRun.
    - name: sonar-analysis
      runAfter:
        - test-frontend
      when:
        - input: $(params.deploy)
          operator: in
          values:
            - "true"

      params:
        - name: organization
          value: $(params.sonar-organization)

        - name: project-key
          value: $(params.sonar-project-key)

        - name: region
          value: $(params.sonar-region)

        - name: revision
          value: $(params.revision)

      taskSpec:
        params:
          - name: organization
            type: string

          - name: project-key
            type: string

          - name: region
            type: string

          - name: revision
            type: string

        workspaces:
          - name: source

        steps:
          - name: analyze-and-check-gate
            # Debian/glibc avoids the scanner runtime issue seen on Alpine.
            image: docker.io/library/node:22-bookworm-slim
            workingDir: $(workspaces.source.path)

            env:
              - name: HOME
                value: $(workspaces.source.path)

              - name: NPM_CONFIG_CACHE
                value: $(workspaces.source.path)/.npm

              - name: SONAR_BINARY_CACHE
                value: $(workspaces.source.path)/.sonar/cache

              - name: SONAR_TOKEN
                valueFrom:
                  secretKeyRef:
                    name: sonarcloud-credentials
                    key: SONAR_TOKEN

            script: |
              #!/bin/bash
              set -euo pipefail

              LCOV_PATH="$(find coverage -type f -name lcov.info -print -quit 2>/dev/null || true)"

              if [ -z "$LCOV_PATH" ]; then
                echo "No lcov.info file was generated under coverage/."
                echo "Ensure @vitest/coverage-v8 is committed as a devDependency."
                exit 1
              fi

              REGION_ARGUMENT=()

              if [ -n "$(params.region)" ]; then
                REGION_ARGUMENT+=("-Dsonar.region=$(params.region)")
              fi

              echo "Using coverage report: $LCOV_PATH"

              npx --yes @sonar/scan@4.3.5 \
                "-Dsonar.organization=$(params.organization)" \
                "-Dsonar.projectKey=$(params.project-key)" \
                "-Dsonar.scm.revision=$(params.revision)" \
                "-Dsonar.sourceEncoding=UTF-8" \
                "-Dsonar.sources=src" \
                "-Dsonar.tests=src" \
                "-Dsonar.test.inclusions=src/**/*.spec.ts" \
                "-Dsonar.exclusions=src/**/*.spec.ts" \
                "-Dsonar.javascript.lcov.reportPaths=${LCOV_PATH}" \
                "-Dsonar.qualitygate.wait=true" \
                "-Dsonar.qualitygate.timeout=300" \
                "${REGION_ARGUMENT[@]}"

      workspaces:
        - name: source
          workspace: source

    # Calculate 4.1 -> 4.2 -> ... -> 4.9 -> 5.0.
    - name: calculate-version
      runAfter:
        - sonar-analysis

      when:
        - input: $(params.deploy)
          operator: in
          values:
            - "true"

      params:
        - name: revision
          value: $(params.revision)

      taskSpec:
        params:
          - name: revision
            type: string

        results:
          - name: immutable-image
            type: string

          - name: version-image
            type: string

          - name: commit-image
            type: string

          - name: latest-image
            type: string

          - name: next-version
            type: string

        steps:
          - name: generate-tags
            image: quay.io/openshift/origin-cli:latest

            env:
              - name: HOME
                value: /tmp

            script: |
              #!/bin/sh
              set -eu

              CURRENT_IMAGE="$(oc get deployment/frontend \
                -o jsonpath='{.spec.template.spec.containers[?(@.name=="frontend")].image}')"

              CURRENT_TAG="${CURRENT_IMAGE##*:}"
              CURRENT_VERSION="${CURRENT_TAG%%-*}"
              CURRENT_VERSION="${CURRENT_VERSION#v}"

              if ! printf '%s' "$CURRENT_VERSION" |
                grep -Eq '^[0-9]+\.[0-9]$'; then
                echo "Cannot determine version from: $CURRENT_IMAGE"
                echo "Expected a tag such as 4.1 or 4.1-abcdef1"
                exit 1
              fi

              MAJOR="${CURRENT_VERSION%%.*}"
              MINOR="${CURRENT_VERSION##*.}"

              if [ "$MINOR" -eq 9 ]; then
                NEXT_VERSION="$((MAJOR + 1)).0"
              else
                NEXT_VERSION="${MAJOR}.$((MINOR + 1))"
              fi

              SHORT_SHA="$(printf '%s' "$(params.revision)" | cut -c1-7)"
              BASE_IMAGE="docker.io/aliyehia/iot-frontend"

              IMMUTABLE_IMAGE="${BASE_IMAGE}:${NEXT_VERSION}-${SHORT_SHA}"
              VERSION_IMAGE="${BASE_IMAGE}:${NEXT_VERSION}"
              COMMIT_IMAGE="${BASE_IMAGE}:sha-${SHORT_SHA}"
              LATEST_IMAGE="${BASE_IMAGE}:latest"

              printf '%s' "$IMMUTABLE_IMAGE" \
                > "$(results.immutable-image.path)"

              printf '%s' "$VERSION_IMAGE" \
                > "$(results.version-image.path)"

              printf '%s' "$COMMIT_IMAGE" \
                > "$(results.commit-image.path)"

              printf '%s' "$LATEST_IMAGE" \
                > "$(results.latest-image.path)"

              printf '%s' "$NEXT_VERSION" \
                > "$(results.next-version.path)"

              echo "Current image:   $CURRENT_IMAGE"
              echo "Next version:    $NEXT_VERSION"
              echo "Immutable image: $IMMUTABLE_IMAGE"
              echo "Version image:   $VERSION_IMAGE"
              echo "Commit image:    $COMMIT_IMAGE"
              echo "Latest image:    $LATEST_IMAGE"

    # Build once and push the immutable image.
    - name: build-and-push
      runAfter:
        - calculate-version

      when:
        - input: $(params.deploy)
          operator: in
          values:
            - "true"

      taskRef:
        resolver: cluster
        params:
          - name: kind
            value: task

          - name: name
            value: buildah

          - name: namespace
            value: openshift-pipelines

      params:
        - name: IMAGE
          value: $(tasks.calculate-version.results.immutable-image)

        - name: DOCKERFILE
          value: ./Dockerfile

        - name: CONTEXT
          value: .

        - name: TLS_VERIFY
          value: "true"

      workspaces:
        - name: source
          workspace: source

        - name: dockerconfig
          workspace: dockerconfig

    # Deploy the candidate image to an internal smoke environment.
    - name: deploy-smoke-frontend
      runAfter:
        - build-and-push

      when:
        - input: $(params.deploy)
          operator: in
          values:
            - "true"

      params:
        - name: image
          value: $(tasks.calculate-version.results.immutable-image)

      taskSpec:
        params:
          - name: image
            type: string

        results:
          - name: smoke-url
            type: string

        steps:
          - name: deploy-smoke
            image: quay.io/openshift/origin-cli:latest

            env:
              - name: HOME
                value: /tmp

            script: |
              #!/bin/sh
              set -eu

              echo "Deploying candidate frontend image:"
              echo "$(params.image)"

              oc apply -f - <<EOF
              apiVersion: apps/v1
              kind: Deployment
              metadata:
                name: frontend-smoke
                labels:
                  app: frontend-smoke
              spec:
                replicas: 1
                strategy:
                  type: Recreate
                selector:
                  matchLabels:
                    app: frontend-smoke
                template:
                  metadata:
                    labels:
                      app: frontend-smoke
                  spec:
                    containers:
                      - name: frontend
                        image: $(params.image)
                        ports:
                          - containerPort: 8080
                        volumeMounts:
                          - name: frontend-nginx-config
                            mountPath: /etc/nginx/conf.d/default.conf
                            subPath: default.conf
                          - name: nginx-cache
                            mountPath: /var/cache/nginx
                          - name: nginx-run
                            mountPath: /var/run
                          - name: nginx-tmp
                            mountPath: /tmp
                    volumes:
                      - name: frontend-nginx-config
                        configMap:
                          name: frontend-nginx-config
                      - name: nginx-cache
                        emptyDir: {}
                      - name: nginx-run
                        emptyDir: {}
                      - name: nginx-tmp
                        emptyDir: {}
              ---
              apiVersion: v1
              kind: Service
              metadata:
                name: frontend-smoke
                labels:
                  app: frontend-smoke
              spec:
                type: ClusterIP
                selector:
                  app: frontend-smoke
                ports:
                  - name: http
                    port: 80
                    targetPort: 8080
              ---
              apiVersion: route.openshift.io/v1
              kind: Route
              metadata:
                name: frontend-smoke
                labels:
                  app: frontend-smoke
              spec:
                to:
                  kind: Service
                  name: frontend-smoke
                port:
                  targetPort: http
                tls:
                  termination: edge
                  insecureEdgeTerminationPolicy: Redirect
              EOF

              if ! oc rollout status deployment/frontend-smoke --timeout=300s; then
                echo "Frontend smoke deployment failed."
                oc get pods -l app=frontend-smoke -o wide || true

                POD_NAME="$(oc get pods -l app=frontend-smoke \
                  -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"

                if [ -n "$POD_NAME" ]; then
                  oc logs "$POD_NAME" --tail=200 || true
                  oc describe pod "$POD_NAME" || true
                fi

                exit 1
              fi

              FRONTEND_HOST="$(oc get route frontend-smoke \
                -o jsonpath='{.spec.host}')"

              if [ -z "$FRONTEND_HOST" ]; then
                echo "Smoke Route host was not assigned."
                exit 1
              fi

              SMOKE_URL="https://${FRONTEND_HOST}"
              printf '%s' "$SMOKE_URL" > "$(results.smoke-url.path)"

              echo "Frontend smoke environment is ready: $SMOKE_URL"
              oc get deployment frontend-smoke
              oc get service frontend-smoke
              oc get route frontend-smoke

    # Run the Maven/TestNG Selenium XML suite before live deployment.
    - name: selenium-sanity-checks
      runAfter:
        - deploy-smoke-frontend

      when:
        - input: $(params.deploy)
          operator: in
          values:
            - "true"

      params:
        - name: base-url
          value: $(tasks.deploy-smoke-frontend.results.smoke-url)

      taskSpec:
        params:
          - name: base-url
            type: string

        workspaces:
          - name: source

        steps:
          - name: run-sanity
            image: docker.io/markhobson/maven-chrome:jdk-17
            workingDir: $(workspaces.source.path)/iot-selenium

            env:
              - name: HOME
                value: /tmp

              - name: MAVEN_OPTS
                value: "-Dmaven.repo.local=$(workspaces.source.path)/.m2/repository"

              - name: SELENIUM_BROWSER
                value: "chrome"

              - name: SELENIUM_BASE_URL
                value: $(params.base-url)

              - name: SELENIUM_API_BASE_URL
                value: "http://iot-backend-svc:8080"

              - name: SELENIUM_LOGIN_EMAIL
                valueFrom:
                  secretKeyRef:
                    name: selenium-credentials
                    key: login-email

              - name: SELENIUM_LOGIN_PASSWORD
                valueFrom:
                  secretKeyRef:
                    name: selenium-credentials
                    key: login-password

            script: |
              #!/bin/sh
              set -u

              echo "Running Selenium sanity suite"
              echo "Frontend: $SELENIUM_BASE_URL"
              echo "Backend:  $SELENIUM_API_BASE_URL"

              if [ ! -f pom.xml ]; then
                echo "ERROR: iot-selenium/pom.xml was not found."
                exit 1
              fi

              if [ ! -f src/test/resources/sanity-check.xml ]; then
                echo "ERROR: sanity-check.xml was not found."
                exit 1
              fi

              mvn -Psanity test
              TEST_STATUS=$?

              echo "Surefire XML reports:"
              find target/surefire-reports -maxdepth 2 -type f -name '*.xml' -print 2>/dev/null || true

              echo "Allure results:"
              find target/allure-results -maxdepth 2 -type f -print 2>/dev/null || true

              exit "$TEST_STATUS"

      workspaces:
        - name: source
          workspace: source

    # Point version, commit, and latest aliases at the same built digest.
    - name: publish-additional-tags
      runAfter:
        - selenium-sanity-checks

      when:
        - input: $(params.deploy)
          operator: in
          values:
            - "true"

      params:
        - name: immutable-image
          value: $(tasks.calculate-version.results.immutable-image)

        - name: version-image
          value: $(tasks.calculate-version.results.version-image)

        - name: commit-image
          value: $(tasks.calculate-version.results.commit-image)

        - name: latest-image
          value: $(tasks.calculate-version.results.latest-image)

      taskSpec:
        params:
          - name: immutable-image
            type: string

          - name: version-image
            type: string

          - name: commit-image
            type: string

          - name: latest-image
            type: string

        workspaces:
          - name: dockerconfig
            optional: true

        steps:
          - name: copy-tags
            image: quay.io/skopeo/stable:latest

            env:
              - name: HOME
                value: /tmp

            script: |
              #!/bin/sh
              set -eu

              AUTH_DIRECTORY="$(workspaces.dockerconfig.path)"

              if [ -f "$AUTH_DIRECTORY/.dockerconfigjson" ]; then
                AUTH_FILE="$AUTH_DIRECTORY/.dockerconfigjson"
              elif [ -f "$AUTH_DIRECTORY/config.json" ]; then
                AUTH_FILE="$AUTH_DIRECTORY/config.json"
              else
                echo "Docker authentication file was not found."
                exit 1
              fi

              skopeo copy \
                --authfile "$AUTH_FILE" \
                "docker://$(params.immutable-image)" \
                "docker://$(params.version-image)"

              skopeo copy \
                --authfile "$AUTH_FILE" \
                "docker://$(params.immutable-image)" \
                "docker://$(params.commit-image)"

              skopeo copy \
                --authfile "$AUTH_FILE" \
                "docker://$(params.immutable-image)" \
                "docker://$(params.latest-image)"

      workspaces:
        - name: dockerconfig
          workspace: dockerconfig

    # Deploy the immutable tag and restore the previous image on failure.
    - name: deploy-frontend
      runAfter:
        - publish-additional-tags

      when:
        - input: $(params.deploy)
          operator: in
          values:
            - "true"

      params:
        - name: image
          value: $(tasks.calculate-version.results.immutable-image)

        - name: version
          value: $(tasks.calculate-version.results.next-version)

      taskSpec:
        params:
          - name: image
            type: string

          - name: version
            type: string

        steps:
          - name: deploy
            image: quay.io/openshift/origin-cli:latest

            env:
              - name: HOME
                value: /tmp

            script: |
              #!/bin/sh
              set -eu

              OLD_IMAGE="$(oc get deployment/frontend \
                -o jsonpath='{.spec.template.spec.containers[?(@.name=="frontend")].image}')"

              NEW_IMAGE="$(params.image)"

              rollback() {
                echo "Restoring previous image: $OLD_IMAGE"
                oc set image deployment/frontend frontend="$OLD_IMAGE" || true
                oc scale deployment/frontend --replicas=1 || true
                oc rollout status deployment/frontend --timeout=300s || true
              }

              echo "Deploying frontend $(params.version)"
              echo "Old image: $OLD_IMAGE"
              echo "New image: $NEW_IMAGE"

              oc set image deployment/frontend frontend="$NEW_IMAGE"
              oc scale deployment/frontend --replicas=1

              if ! oc rollout status deployment/frontend --timeout=300s; then
                echo "Frontend rollout failed."
                rollback
                exit 1
              fi

              DEPLOYED_IMAGE="$(oc get deployment/frontend \
                -o jsonpath='{.spec.template.spec.containers[?(@.name=="frontend")].image}')"

              if [ "$DEPLOYED_IMAGE" != "$NEW_IMAGE" ]; then
                echo "Deployment image verification failed."
                echo "Expected: $NEW_IMAGE"
                echo "Actual:   $DEPLOYED_IMAGE"
                rollback
                exit 1
              fi

              echo "Frontend deployment succeeded."
              echo "Deployed image: $DEPLOYED_IMAGE"
              oc get deployment frontend
              oc get pods -l app=frontend

  finally:
    # Always remove the temporary frontend Deployment, Service, and Route.
    - name: cleanup-smoke-frontend
      when:
        - input: $(params.deploy)
          operator: in
          values:
            - "true"

      taskSpec:
        steps:
          - name: cleanup
            image: quay.io/openshift/origin-cli:latest

            env:
              - name: HOME
                value: /tmp

            script: |
              #!/bin/sh
              set -eu

              oc delete deployment/frontend-smoke \
                service/frontend-smoke \
                route/frontend-smoke \
                --ignore-not-found=true \
                --wait=false

              echo "Frontend smoke environment cleanup requested."