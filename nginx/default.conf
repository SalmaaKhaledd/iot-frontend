server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;

    # Avoid stale shells after deploys; hashed chunk filenames remain cacheable below.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|ico|gif|jpe?g|png|webp|woff2?|svg)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }
}
